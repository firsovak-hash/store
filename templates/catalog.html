{% extends "base.html" %}

{% block title %}Каталог{% endblock %}

{% block content %}
<h1 style="text-align: center; margin-bottom: 40px;">Каталог фигурок</h1>

<div class="catalog-grid">
    {% for product in products %}
    <div class="catalog-card">
        <div class="card-image" onclick="window.location.href='/product/{{ product.id }}'">
            <i class="fas fa-cube"></i>
        </div>
        <div class="card-info">
            <h3>{{ product.name }}</h3>
            <p>{{ product.description[:80] }}...</p>
            <div class="price">{{ product.price }} ₽</div>
            
            <!-- КНОПКА ДОБАВЛЕНИЯ В КОРЗИНУ -->
            <button class="card-btn add-to-cart" 
                    data-id="{{ product.id }}"
                    data-name="{{ product.name }}"
                    data-price="{{ product.price }}">
                🛒 Добавить в корзину
            </button>
        </div>
    </div>
    {% endfor %}
</div>

<style>
    .catalog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 30px;
        padding: 20px 0;
    }
    .catalog-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        overflow: hidden;
        transition: 0.3s;
        border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .catalog-card:hover {
        transform: translateY(-5px);
        background: white;
    }
    .card-image {
        height: 220px;
        background: rgba(216, 107, 126, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    .card-image i {
        font-size: 64px;
        color: #d66b7e;
    }
    .card-info {
        padding: 20px;
    }
    .card-info h3 {
        margin-bottom: 8px;
    }
    .price {
        font-size: 24px;
        font-weight: 700;
        color: #d66b7e;
        margin: 12px 0;
    }
    .card-btn {
        background: #d66b7e;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 30px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
        width: 100%;
    }
    .card-btn:hover {
        background: #c05a6d;
        transform: scale(1.02);
    }
    .added-toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #4caf50;
        color: white;
        padding: 12px 24px;
        border-radius: 40px;
        z-index: 1000;
        font-weight: 500;
        animation: fadeOut 2s ease forwards;
    }
    @keyframes fadeOut {
        0% { opacity: 1; transform: translateX(-50%) translateY(0); }
        70% { opacity: 1; }
        100% { opacity: 0; transform: translateX(-50%) translateY(-20px); visibility: hidden; }
    }
</style>

<script>
// Функция показа уведомления
function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'added-toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

// Обработчики кнопок "Добавить в корзину"
document.querySelectorAll('.add-to-cart').forEach(btn => {
    btn.addEventListener('click', async function(e) {
        e.stopPropagation(); // Чтобы не сработал переход на страницу товара
        
        const product = {
            product_id: this.dataset.id,
            name: this.dataset.name,
            price: parseInt(this.dataset.price)
        };
        
        try {
            const response = await fetch('/api/cart/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(product)
            });
            
            const data = await response.json();
            
            if (data.success) {
                // Меняем текст кнопки временно
                const originalText = this.innerHTML;
                this.innerHTML = '✓ Добавлено!';
                setTimeout(() => {
                    this.innerHTML = originalText;
                }, 1500);
                
                showToast('✅ Товар добавлен в корзину');
                
                // Обновляем виджет на Тильде (если открыт в iframe)
                if (window.parent && window.parent.updateCartWidget) {
                    window.parent.updateCartWidget();
                }
            }
        } catch (err) {
            console.error('Ошибка:', err);
            showToast('❌ Ошибка, попробуйте позже');
        }
    });
});
</script>
{% endblock %}
