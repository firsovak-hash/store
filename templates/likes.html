{% extends "base.html" %}

{% block title %}Избранное{% endblock %}

{% block extra_css %}
<style>
    .likes-page { background: #fff; min-height: 100vh; padding: 60px 0 120px; }

    .likes-page-header {
        text-align: center;
        padding: 60px 20px 50px;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #000;
        font-family: 'Inter', sans-serif;
    }

    .likes-wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 40px 80px;
    }

    .likes-row {
        display: grid;
        grid-template-columns: 80px 1fr auto auto;
        gap: 24px;
        align-items: center;
        padding: 24px 0;
        border-bottom: 1px solid #f0f0f0;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity .4s ease, transform .4s ease;
    }
    .likes-row.visible { opacity: 1; transform: translateY(0); }

    .likes-row-img {
        width: 80px; height: 80px;
        background: #ebebeb; border-radius: 4px;
        overflow: hidden;
    }
    .likes-row-img img { width:100%; height:100%; object-fit:cover; }

    .likes-row-name { font-size: 16px; font-weight: 400; color: #000; margin-bottom: 6px; }
    .likes-row-price { font-size: 14px; color: #9e9e9e; }

    .likes-row-add {
        background: #000; color: #fff;
        border: none; padding: 10px 22px;
        font-size: 13px; letter-spacing: .5px;
        border-radius: 5px; cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: opacity .2s; white-space: nowrap;
    }
    .likes-row-add:hover { opacity: .75; }

    .likes-row-remove {
        background: none; border: none;
        color: #ccc; font-size: 22px;
        cursor: pointer; padding: 0 4px;
    }
    .likes-row-remove:hover { color: #000; }

    .likes-empty-state {
        text-align: center;
        padding: 80px 20px;
        color: #9e9e9e;
        font-size: 15px;
        font-family: 'Inter', sans-serif;
    }
    .likes-empty-state a { color: #000; text-decoration: underline; }

    .likes-toast {
        position: fixed; bottom: 30px; left: 50%;
        transform: translateX(-50%);
        background: #000; color: #fff;
        padding: 12px 28px; font-size: 13px;
        border-radius: 4px; z-index: 3000;
        animation: likesToastFade 2.1s forwards;
        font-family: 'Inter', sans-serif;
    }
    @keyframes likesToastFade {
        0%,70% { opacity:1; } 100% { opacity:0; }
    }

    @media (max-width: 600px) {
        .likes-row { grid-template-columns: 64px 1fr; gap: 14px; }
        .likes-row-add, .likes-row-remove { grid-column: 2; }
        .likes-wrap { padding: 0 16px 60px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="likes-page">
    <div class="likes-page-header">Избранное</div>
    <div class="likes-wrap" id="likesWrap">
        <div class="likes-empty-state">Загрузка...</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const PRODUCTS_DATA = {
        {% for i in range(1, 11) %}
        '{{ i }}': { name: 'Шмотка {{ i }}', price: {{ 1500 + i * 100 }}, image: '/static/images/photo_2026-05-17_22.34.33.jpeg' },
        {% endfor %}
    };

    function renderLikes() {
        const wrap = document.getElementById('likesWrap');
        const liked = JSON.parse(localStorage.getItem('liked_products') || '[]');

        if (!liked.length) {
            wrap.innerHTML = '<div class="likes-empty-state">Нет избранных товаров — <a href="/catalog">перейти в каталог</a></div>';
            return;
        }

        wrap.innerHTML = liked.map(id => {
            const p = PRODUCTS_DATA[id];
            if (!p) return '';
            return `
                <div class="likes-row">
                    <div class="likes-row-img"><img src="${p.image}" alt=""></div>
                    <div>
                        <div class="likes-row-name">${p.name}</div>
                        <div class="likes-row-price">${p.price.toLocaleString('ru')} р.</div>
                    </div>
                    <button class="likes-row-add" onclick="addToCartFromLikes('${id}','${p.name}',${p.price})">В корзину</button>
                    <button class="likes-row-remove" onclick="removeLike('${id}')">×</button>
                </div>
            `;
        }).join('');

        document.querySelectorAll('.likes-row').forEach((el, i) => {
            setTimeout(() => el.classList.add('visible'), i * 60);
        });
    }

    function removeLike(id) {
        let liked = JSON.parse(localStorage.getItem('liked_products') || '[]');
        liked = liked.filter(l => l !== id);
        localStorage.setItem('liked_products', JSON.stringify(liked));
        if (window.updateLikesCount) updateLikesCount();
        renderLikes();
    }

    async function addToCartFromLikes(id, name, price) {
        try {
            const res = await fetch('/api/cart/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_id: id, name, price })
            });
            const data = await res.json();
            if (data.success) {
                showLikesToast(name + ' добавлен в корзину');
                if (window.updateCartCount) updateCartCount();
            }
        } catch {}
    }

    function showLikesToast(msg) {
        const t = document.createElement('div');
        t.className = 'likes-toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2200);
    }

    renderLikes();
</script>
{% endblock %}
