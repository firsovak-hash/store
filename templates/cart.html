<!-- templates/cart.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | 3D Figurki</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
        }
        
        /* Шапка */
        .header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            background: linear-gradient(135deg, #fff, #d66b7e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .back-link {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
        }
        
        /* Контейнер корзины */
        .cart-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .cart-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 32px;
        }
        
        /* Список товаров */
        .cart-items-list {
            margin-bottom: 30px;
        }
        
        .cart-item {
            display: grid;
            grid-template-columns: 100px 2fr 1fr 1fr 40px;
            gap: 20px;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .cart-item-image {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        .cart-item-title {
            font-weight: 500;
            margin-bottom: 6px;
        }
        
        .cart-item-price {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }
        
        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
            font-size: 18px;
        }
        
        .qty-btn:hover {
            background: #d66b7e;
            border-color: #d66b7e;
        }
        
        .qty-num {
            font-size: 16px;
            min-width: 24px;
            text-align: center;
        }
        
        .cart-item-total {
            font-weight: 600;
            color: #d66b7e;
        }
        
        .cart-item-remove {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: rgba(255,255,255,0.5);
        }
        
        .cart-item-remove:hover {
            color: #e74c3c;
        }
        
        /* Итого */
        .cart-summary {
            margin-top: 40px;
            text-align: right;
            padding-top: 20px;
            border-top: 2px solid rgba(255,255,255,0.2);
        }
        
        .cart-total-row {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
        }
        
        .cart-total-price {
            color: #d66b7e;
            margin-left: 16px;
        }
        
        .checkout-btn {
            background: #d66b7e;
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 40px;
            transition: 0.2s;
        }
        
        .checkout-btn:hover {
            background: #c05a6d;
            transform: translateY(-2px);
        }
        
        /* Пустая корзина */
        .empty-cart {
            text-align: center;
            padding: 60px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
        }
        
        .empty-cart i {
            font-size: 64px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 20px;
        }
        
        .empty-cart a {
            color: #d66b7e;
            text-decoration: none;
        }
        
        /* Адаптив */
        @media (max-width: 700px) {
            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 12px;
            }
            .cart-item-quantity, .cart-item-total, .cart-item-remove {
                grid-column: 2 / 3;
                justify-self: start;
            }
            .cart-item-remove {
                justify-self: end;
            }
        }
        
        /* Уведомление */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            z-index: 1000;
            font-weight: 500;
            animation: fadeOut 2s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="logo">3D Figurki</a>
        <a href="/catalog" class="back-link">← Вернуться в каталог</a>
    </div>
    
    <div class="cart-container">
        <h1 class="cart-title">🛒 Корзина</h1>
        
        <div id="cart-content">
            <!-- Сюда загрузится корзина через JavaScript -->
            <div style="text-align: center; padding: 40px;">Загрузка...</div>
        </div>
    </div>
    
    <script>
        // Адрес API (тот же сервер)
        const API_URL = '';
        
        // Функция загрузки корзины
        async function loadCart() {
            try {
                const response = await fetch('/api/cart/items');
                const data = await response.json();
                const cart = data.items || [];
                
                const container = document.getElementById('cart-content');
                
                if (cart.length === 0) {
                    container.innerHTML = `
                        <div class="empty-cart">
                            <i class="fas fa-shopping-bag"></i>
                            <h3>Корзина пуста</h3>
                            <p>Перейдите в <a href="/catalog">каталог</a>, чтобы выбрать товары</p>
                        </div>
                    `;
                    return;
                }
                
                let itemsHtml = `<div class="cart-items-list">`;
                let total = 0;
                
                // ЦИКЛ: пробегаем по КАЖДОМУ товару в корзине
                for (const item of cart) {
                    const itemTotal = item.price * (item.quantity || 1);
                    total += itemTotal;
                    
                    itemsHtml += `
                        <div class="cart-item" data-id="${item.id}">
                            <div class="cart-item-image">
                                <i class="fas fa-cube"></i>
                            </div>
                            <div class="cart-item-details">
                                <div class="cart-item-title">${escapeHtml(item.name)}</div>
                                <div class="cart-item-price">${item.price} ₽</div>
                            </div>
                            <div class="cart-item-quantity">
                                <button class="qty-btn minus" onclick="changeQuantity('${item.id}', -1)">-</button>
                                <span class="qty-num">${item.quantity || 1}</span>
                                <button class="qty-btn plus" onclick="changeQuantity('${item.id}', 1)">+</button>
                            </div>
                            <div class="cart-item-total">${itemTotal} ₽</div>
                            <button class="cart-item-remove" onclick="removeItem('${item.id}')">✕</button>
                        </div>
                    `;
                }
                
                itemsHtml += `</div>`;
                
                container.innerHTML = itemsHtml + `
                    <div class="cart-summary">
                        <div class="cart-total-row">
                            ИТОГО:
                            <span class="cart-total-price">${total} ₽</span>
                        </div>
                        <button class="checkout-btn" onclick="checkout()">
                            ОФОРМИТЬ ЗАКАЗ
                        </button>
                    </div>
                `;
                
                // Обновляем счетчик в шапке
                updateCartCount();
                
            } catch (err) {
                console.error('Ошибка загрузки корзины:', err);
                document.getElementById('cart-content').innerHTML = `
                    <div class="empty-cart">
                        <p>Ошибка загрузки корзины</p>
                    </div>
                `;
            }
        }
        
        // Функция изменения количества (использует API /api/cart/add)
        window.changeQuantity = async function(productId, delta) {
            try {
                // Отправляем запрос на добавление (если delta=1) или удаление 1 штуки
                // Для уменьшения можно вызвать add с отрицательным количеством
                // или сделать отдельный API. Для простоты используем add
                const response = await fetch('/api/cart/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: productId })
                });
                
                if (response.ok) {
                    loadCart(); // Перезагружаем корзину
                } else {
                    showToast('❌ Ошибка', true);
                }
            } catch (err) {
                showToast('❌ Ошибка соединения', true);
            }
        };
        
        // Функция удаления товара (использует API /api/cart/remove)
        window.removeItem = async function(productId) {
            try {
                const response = await fetch('/api/cart/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: productId })
                });
                
                if (response.ok) {
                    loadCart();
                    showToast('🗑️ Товар удалён из корзины');
                } else {
                    showToast('❌ Ошибка удаления', true);
                }
            } catch (err) {
                showToast('❌ Ошибка соединения', true);
            }
        };
        
        // Функция оформления заказа
        window.checkout = function() {
            window.location.href = '/order';
        };
        
        // Обновление счетчика корзины
        async function updateCartCount() {
            try {
                const response = await fetch('/api/cart/count');
                const data = await response.json();
                const elements = document.querySelectorAll('.cart-count');
                elements.forEach(el => {
                    if (el) el.textContent = data.count || 0;
                });
            } catch (err) {}
        }
        
        // Уведомление
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = isError ? '#e74c3c' : '#2ecc71';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // Защита от XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Загружаем корзину при открытии страницы
        loadCart();
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
</html>
