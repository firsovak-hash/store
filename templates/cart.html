{% extends "base.html" %}

{% block title %}Корзина{% endblock %}

{% block extra_css %}
<style>
    .cart-page { background: #000; min-height: 100vh; padding: 20px 0 40px; }

    .cart-page-header {
        text-align: center;
        padding: 30px 20px 40px;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #fff;
        font-family: 'Inter', sans-serif;
    }

    .cart-wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 40px 80px;
    }

    .cart-row {
        display: grid;
        grid-template-columns: 80px 1fr auto auto;
        gap: 24px;
        align-items: center;
        padding: 24px 0;
        border-bottom: 1px solid #1a1a1a;
    }

    .cart-row-img {
        width: 80px; height: 80px;
        background: #161616;
        border-radius: 8px;
        overflow: hidden;
    }
    .cart-row-img img { width:100%; height:100%; object-fit:cover; }

    .cart-row-name { font-size: 16px; font-weight: 500; color: #fff; margin-bottom: 6px; }
    .cart-row-price { font-size: 14px; color: #888; }

    .cart-row-qty {
        display: flex; align-items: center; gap: 12px;
    }
    .cart-row-qty button {
        width: 30px; height: 30px;
        background: transparent; border: 1px solid #2a2a2a;
        color: #999;
        border-radius: 50%; font-size: 18px;
        cursor: pointer; display: flex;
        align-items: center; justify-content: center;
        transition: color .2s, border-color .2s;
    }
    .cart-row-qty button:hover { border-color: #fff; color: #fff; }
    .cart-row-qty span { font-size: 15px; min-width: 24px; text-align: center; color: #fff; }

    .cart-row-total { font-size: 16px; font-weight: 500; color: #fff; min-width: 80px; text-align: right; }

    .cart-row-remove {
        background: none; border: none;
        color: #444; font-size: 22px;
        cursor: pointer; padding: 0 4px;
    }
    .cart-row-remove:hover { color: #fff; }

    .cart-summary-block {
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        flex-direction: column;
        align-items: flex-end;
        gap: 16px;
        padding-top: 40px;
    }

    .cart-total-line {
        font-size: 20px;
        font-weight: 600;
        color: #fff;
        display: flex;
        gap: 16px;
    }

    .cart-checkout-btn {
        background: #fff; color: #000;
        border: none; padding: 14px 48px;
        font-size: 14px; letter-spacing: .5px; font-weight: 600;
        border-radius: 8px; cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: opacity .2s;
    }
    .cart-checkout-btn:hover { opacity: .8; }

    .cart-empty-state {
        text-align: center;
        padding: 80px 20px;
        color: #888;
        font-size: 15px;
        font-family: 'Inter', sans-serif;
    }
    .cart-empty-state a {
        color: #fff;
        text-decoration: underline;
    }

    .cart-toast {
        position: fixed; bottom: 30px; left: 50%;
        transform: translateX(-50%);
        background: #000; color: #fff;
        padding: 12px 28px; font-size: 13px;
        border-radius: 4px; z-index: 3000;
        animation: cartToastFade 2.1s forwards;
        font-family: 'Inter', sans-serif;
    }
    @keyframes cartToastFade {
        0%,70% { opacity:1; } 100% { opacity:0; }
    }

    @media (max-width: 600px) {
        .cart-row { grid-template-columns: 64px 1fr; gap: 14px; }
        .cart-row-qty, .cart-row-total, .cart-row-remove { grid-column: 2; }
        .cart-wrap { padding: 0 16px 60px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="cart-page">
    <div class="cart-page-header">Корзина</div>
    <div class="cart-wrap" id="cartWrap">
        <div class="cart-empty-state">Загрузка...</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadCartPage() {
        const wrap = document.getElementById('cartWrap');
        try {
            const [ir, tr] = await Promise.all([fetch('/api/cart/items'), fetch('/api/cart/total')]);
            const { items } = await ir.json();
            const { total }  = await tr.json();

            if (!items.length) {
                wrap.innerHTML = '<div class="cart-empty-state">Корзина пуста — <a href="/catalog">перейти в каталог</a></div>';
                return;
            }

            const rows = items.map(item => `
                <div class="cart-row">
                    <div class="cart-row-img"><img src="/static/images/product_main.jpg" alt=""></div>
                    <div>
                        <div class="cart-row-name">${esc(item.name)}</div>
                        <div class="cart-row-price">${item.price.toLocaleString('ru')} р. за шт.</div>
                    </div>
                    <div class="cart-row-qty">
                        <button onclick="cpQty('${item.id}','${esc(item.name)}',${item.price},-1)">−</button>
                        <span>${item.quantity || 1}</span>
                        <button onclick="cpQty('${item.id}','${esc(item.name)}',${item.price},1)">+</button>
                    </div>
                    <div class="cart-row-total">${(item.price*(item.quantity||1)).toLocaleString('ru')} р.</div>
                    <button class="cart-row-remove" onclick="cpRemove('${item.id}')">×</button>
                </div>
            `).join('');

            wrap.innerHTML = rows + `
                <div class="cart-summary-block">
                    <div class="cart-total-line">
                        <span>Итого</span>
                        <span>${(total||0).toLocaleString('ru')} р.</span>
                    </div>
                    <button class="cart-checkout-btn" onclick="location.href='/order'">Оформить заказ</button>
                </div>
            `;
        } catch {
            wrap.innerHTML = '<div class="cart-empty-state">Ошибка загрузки</div>';
        }
    }

    async function cpRemove(id) {
        await fetch('/api/cart/remove', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({product_id:id}) });
        loadCartPage(); if(window.updateCartCount) updateCartCount();
        showCartToast('Товар удалён');
    }

    async function cpQty(id, name, price, delta) {
        if (delta < 0) {
            const r = await fetch('/api/cart/items');
            const { items } = await r.json();
            const item = items.find(i => i.id === id);
            if (item && (item.quantity||1) <= 1) { cpRemove(id); return; }
            await fetch('/api/cart/remove', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({product_id:id}) });
            await fetch('/api/cart/add',    { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({product_id:id, name, price}) });
        } else {
            await fetch('/api/cart/add', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({product_id:id, name, price}) });
        }
        loadCartPage(); if(window.updateCartCount) updateCartCount();
    }

    function showCartToast(msg) {
        const t = document.createElement('div');
        t.className = 'cart-toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2200);
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    loadCartPage();
</script>
{% endblock %}
